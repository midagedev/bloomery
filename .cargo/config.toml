# 박스(5975WX, Zen 3)가 유일한 실행 기계다. 기준 x86-64 타깃으로는 스칼라 루프가 SSE2로만
# 컴파일되고 round_ties_even 같은 것이 libm 호출이 된다. rustc는 mul+add를 FMA로 합치지
# 않으므로 값은 그대로다 — plain cargo 빌드(CPU 게이트·벤치·bloomery-decode)가 이 플래그 아래서
# 돈다. cargo oxide 빌드는 이 표를 보지 못한다: cargo-oxide가 내보내는 CARGO_ENCODED_RUSTFLAGS가
# target.<triple>.rustflags를 가린다. These tables are the only list: tools/oxide-host.sh writes
# .cargo/cuda-oxide.toml (untracked) for the triple a `cargo oxide` build is for from the table of that triple, and
# tools/check-rustflags.sh (just check-rustflags) holds the tables, the generator and the file together.
[target.x86_64-unknown-linux-gnu]
# znver3 turns on sse4a; with it LLVM lowers some byte shuffles to EXTRQ/INSERTQ, which have no VEX
# form, and inside AVX code each one takes a ymm spill fault and fill faults on Zen 3. -sse4a keeps
# every other znver3 feature.
rustflags = ["-C", "target-cpu=znver3", "-C", "target-feature=-sse4a"]

# DGX Spark(GB10, Cortex-X925 + A725). znver3는 aarch64의 프로세서 이름이 아니어서 rustc가 크레이트마다
# 경고하고 일부 크레이트(glob, regex-syntax)에서 LLVM 안에서 SIGSEGV로 죽는다. native는 빌드하는
# 기계의 CPU를 쓴다 — 이 표는 그 기계에서 빌드하고 그 기계에서 도는 바이너리를 위한 것이다.
[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=native"]

# cuda-device, cuda-host and cuda-macros use `#![feature(..)]` gates, and `cargo oxide` passes `-Z` options to rustc. The
# pinned toolchain is a stable release (rust-toolchain.toml), which accepts both only with RUSTC_BOOTSTRAP=1. This is the
# same entry `cargo oxide new` writes into a project's .cargo/config.toml. bloomery's own crates use no feature gate.
[env]
RUSTC_BOOTSTRAP = "1"
