# Builds the signed and notarized Apple Silicon archive on a hosted macOS arm64 runner, so a release needs no
# maintainer's Mac in the loop: the Developer ID certificate and the App Store Connect API key come from the
# repository's secrets into a temporary keychain that lives only for the job. The build itself is
# tools/release/build-mac.sh unchanged (its checks: the pinned toolchain, the tag's commit, minos, the signature,
# notarization), run at the tag's commit. The archive is uploaded as a workflow artifact and, when the release
# exists, to the release's assets (never over a file already there: tools/release/publish.sh owns the release).
#
# Secrets (repository settings → Secrets and variables → Actions):
#   MAC_CERT_P12_BASE64   the Developer ID Application certificate with its private key, a .p12 export, base64
#   MAC_CERT_PASSWORD     that export's password
#   NOTARY_KEY_ID         the App Store Connect API key id (Users and Access → Integrations → Team Keys)
#   NOTARY_ISSUER_ID      its issuer id
#   NOTARY_KEY_P8_BASE64  the key's .p8 file, base64
name: macOS release archive

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag to build (vX.Y.Z)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build, sign and notarize
    runs-on: macos-26
    timeout-minutes: 90
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Toolchain
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --default-toolchain none
          "$HOME/.cargo/bin/rustup" show active-toolchain || "$HOME/.cargo/bin/rustup" toolchain install
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          sw_vers; xcodebuild -version | head -1

      - name: Import the signing identity and the notary key into a temporary keychain
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          for v in MAC_CERT_P12_BASE64 MAC_CERT_PASSWORD NOTARY_KEY_ID NOTARY_ISSUER_ID NOTARY_KEY_P8_BASE64; do
            [ -n "${!v}" ] || { echo "release-mac: the secret $v is not set" >&2; exit 1; }
          done
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # notarytool reads a profile from the default keychain, so the temporary one is the default for this job.
          security default-keychain -s "$KEYCHAIN"
          printf '%s' "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          rm -f "$RUNNER_TEMP/cert.p12"
          identity=$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/^ *1) \([0-9A-F]*\) "Developer ID Application:.*/\1/p')
          [ -n "$identity" ] || { echo "release-mac: no Developer ID Application identity in the imported certificate" >&2; security find-identity -v -p codesigning "$KEYCHAIN"; exit 1; }
          printf '%s' "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials bloomery-notary --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --keychain "$KEYCHAIN" > /dev/null
          rm -f "$RUNNER_TEMP/notary.p8"
          echo "MAC_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "MAC_NOTARY_PROFILE=bloomery-notary" >> "$GITHUB_ENV"
          echo "RELEASE_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build the archive
        run: |
          set -euo pipefail
          version=${TAG#v}
          bash tools/release/build-mac.sh "$version"
          ls -l target/mac-release/dist/

      - name: Upload the archive as a workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: bloomery-${{ env.TAG }}-macos-arm64-metal
          path: |
            target/mac-release/dist/*.tar.gz
            target/mac-release/dist/*.tar.gz.sha256
          if-no-files-found: error

      - name: Upload to the release when it exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/assets" 2> /dev/null; then
            echo "release-mac: no release $TAG yet; the archive is this run's artifact"; exit 0
          fi
          for f in target/mac-release/dist/*.tar.gz target/mac-release/dist/*.tar.gz.sha256; do
            if grep -qx "$(basename "$f")" "$RUNNER_TEMP/assets"; then echo "release-mac: $(basename "$f") is already on $TAG, not replaced"; continue; fi
            gh release upload "$TAG" "$f"
          done

      - name: Remove the temporary keychain
        if: always()
        run: |
          [ -z "${RELEASE_KEYCHAIN:-}" ] || security delete-keychain "$RELEASE_KEYCHAIN" || true
