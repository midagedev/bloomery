# Shingler, the review bot: one review on every ready pull request, a yes or a no. CLEAN approves, MUST_FIX requests
# changes (tools/review/post.py decides the event; a CLEAN review of a path that changes the bot, CI or the toolchain
# is a COMMENT that asks for a person). Instructions: .github/review/reviewer.md and validator.md; the patterns it learns from:
# .github/review/escape-catalog.md; design and knobs: .github/review/README.md.
#
# pull_request_target, so a fork's pull request gets the API key, and the trust rules that follow from it:
# - This file, the instructions and tools/review/ come from the base branch. A pull request cannot change what
#   reviews it.
# - The PR head is checked out as data. The diagnostics parse it, and Claude reads it with Read/Grep/Glob only (no
#   Bash, no web). Codex reads it with shell commands, and the PR's text can steer which commands the model runs,
#   scripts from the PR included. Those commands run in a sandbox (tools/review/run-codex.sh): they read the trees,
#   CTX, the Codex install and system paths such as /usr and /etc, write only OUT, and have no network. Before each
#   run a sandbox check tries a read beside the login, a write into the PR tree and a connection; if one works, Codex
#   does not run.
# - The engine: REVIEW_ENGINE (a repository variable; claude when unset) is tried first and the other engine is the
#   fallback, each only when its login is there (tools/review/run.py). With no engine able to review, the run ends
#   without a review and says why in the summary.
# - A rebase does not make a new review of the same patches (tools/review/carry.py): when the new head's commits are the
#   patches the bot approved, the approval carries and no model runs (mode=carry); when some changed, the reviewer reads
#   only those (mode=interdiff). The reviewer's own tree ids and the ledger version in the earlier review's marker must
#   equal today's, and only an approval carries. A replacement pull request names the one it replaces ("Supersedes #N").
# - The logins and the write token never share a job: `review` holds ANTHROPIC_API_KEY and the Codex login
#   (CODEX_AUTH_JSON, written to a file outside the trees) with a read-only token, `post` holds pull-requests and
#   issues write and no login. post.py refuses to post output that carries a login or a token-shaped string, and
#   files at most two issues a run.
name: Shingler

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review (a full review, past the re-review cap)
        required: true

permissions:
  contents: read

concurrency:
  group: pr-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

env:
  CLAUDE_CODE_VERSION: 2.1.284
  REVIEW_MODEL: claude-sonnet-5-5
  CODEX_VERSION: 0.160.0
  REVIEW_CODEX_MODEL: gpt-6.1-sol
  REVIEW_ENGINE: ${{ vars.REVIEW_ENGINE || 'claude' }}
  # The automatic reviews a pull request gets before it needs a workflow_dispatch run (a carry is not one: no model ran).
  REVIEW_CAP: 5

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.g.outputs.run }}
      pr: ${{ steps.g.outputs.pr }}
      base_sha: ${{ steps.g.outputs.base_sha }}
      head_sha: ${{ steps.g.outputs.head_sha }}
      head_repo: ${{ steps.g.outputs.head_repo }}
      prev_sha: ${{ steps.g.outputs.prev_sha }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/pulls/$PR" > pr.json
          draft=$(jq -r .draft pr.json)
          state=$(jq -r .state pr.json)
          author_type=$(jq -r .user.type pr.json)
          skip_label=$(jq -r '[.labels[].name] | index("no-review") != null' pr.json)
          {
            echo "pr=$PR"
            echo "base_sha=$(jq -r .base.sha pr.json)"
            echo "head_sha=$(jq -r .head.sha pr.json)"
            echo "head_repo=$(jq -r .head.repo.full_name pr.json)"
          } >> "$GITHUB_OUTPUT"
          # The bot's earlier reviews carry a footer marker with the head they reviewed.
          gh api --paginate "repos/$REPO/pulls/$PR/reviews" \
            --jq '.[] | select(.user.login == "github-actions[bot]") | .body' > prev-bodies.txt || true
          count=$(grep '<!-- bloomery-review head_sha=' prev-bodies.txt | grep -vc ' mode=carry ' || true)
          prev=$(grep -o '<!-- bloomery-review head_sha=[0-9a-f]*' prev-bodies.txt | tail -1 | sed 's/.*head_sha=//' || true)
          run=true; why=""
          if [ "$state" != open ]; then run=false; why="the pull request is $state"; fi
          if [ "$EVENT" != workflow_dispatch ]; then
            if [ "$draft" = true ]; then run=false; why="draft"; fi
            if [ "$author_type" = Bot ]; then run=false; why="opened by a bot"; fi
            if [ "$skip_label" = true ]; then run=false; why="labelled no-review"; fi
            if [ "$count" -ge "$REVIEW_CAP" ]; then run=false; why="$count automatic reviews (cap $REVIEW_CAP); run the workflow by hand for another"; fi
          else
            prev=""   # a dispatched run is a full review
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "prev_sha=$prev" >> "$GITHUB_OUTPUT"
          echo "review: run=$run ${why:+($why)} earlier=$count prev=${prev:-none}" | tee -a "$GITHUB_STEP_SUMMARY"

  diagnostics:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No secret here: the tools parse the PR's source as data, and their own code is pinned by commit.
    permissions:
      contents: read
    steps:
      # The tools come from the branch this workflow runs from (github.sha), never from the pull request's base
      # commit: a pull request opened before a tools change has an older base.
      - name: Checkout the tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: trusted
          sparse-checkout: tools/review
          persist-credentials: false
      - name: Checkout the pull request's base (the before side of the comparison)
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.base_sha }}
          path: base
          persist-credentials: false
      - name: Checkout the PR head (data only)
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.gate.outputs.head_repo }}
          ref: ${{ needs.gate.outputs.head_sha }}
          path: pr
          persist-credentials: false
          # A fork head under pull_request_target: checked out as data only (nothing from it runs; see the header).
          allow-unsafe-pr-checkout: true
      # dryer and crapper (github.com/unclebob), pinned by commit; their dependencies (tree-sitter) from PyPI. The
      # built venv is cached by the two commits: only our own steps write it, never anything from the PR.
      - name: Cache dryer and crapper
        id: ubcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bloomery-review/ub
          key: ub-${{ runner.os }}-66ff6d21a42c04afcad89c78a80066176d1294b0-9f1bead298b5a9d576bdd6319289fcf426e5b18a
      - name: Install dryer and crapper
        if: steps.ubcache.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          DRYER_SHA: 66ff6d21a42c04afcad89c78a80066176d1294b0
          CRAPPER_SHA: 9f1bead298b5a9d576bdd6319289fcf426e5b18a
        run: |
          set -euo pipefail
          ub="$HOME/.cache/bloomery-review/ub"
          mkdir -p "$ub"
          for t in dryer:$DRYER_SHA crapper:$CRAPPER_SHA; do
            name=${t%%:*}; sha=${t#*:}
            git init -q "$ub/$name"
            git -C "$ub/$name" fetch -q --depth 1 "https://github.com/unclebob/$name" "$sha"
            git -C "$ub/$name" checkout -q FETCH_HEAD
          done
          python3 -m venv "$ub/venv"
          "$ub/venv/bin/pip" install -q "$ub/dryer" "$ub/crapper"
      - name: Run the diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.gate.outputs.pr }}
        run: |
          set -euo pipefail
          mkdir -p diag
          gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | select(.status != "removed") | .filename' > diag/changed.txt
          # Never fails the job: a tool that cannot run is named in diagnostics.md, which the reviewer reads.
          gh api "repos/$REPO/pulls/$PR" -H 'Accept: application/vnd.github.diff' > diag/diff.patch
          ub="$HOME/.cache/bloomery-review/ub/venv/bin"
          s=$(date +%s)
          python3 trusted/tools/review/diagnostics.py --base "$PWD/base" --pr "$PWD/pr" --changed diag/changed.txt \
            --diff diag/diff.patch --out diag/diagnostics.md --dryer "$ub/dryer" --crapper "$ub/crapper" > /dev/null || true
          echo "diagnostics: $(( $(date +%s) - s )) s" >> "$GITHUB_STEP_SUMMARY"
          test -s diag/diagnostics.md || echo "The diagnostics did not run (diagnostics.py wrote nothing)." > diag/diagnostics.md
          cat diag/diagnostics.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: diag/diagnostics.md

  review:
    needs: [gate, diagnostics]
    if: always() && needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Each role may run on both engines: reviewer 20 + 20 minutes, validator 10 + 10 (tools/review/run.py MINUTES).
    timeout-minutes: 75
    permissions:
      contents: read
      pull-requests: read
    outputs:
      reviewed: ${{ steps.check.outcome == 'success' }}
    steps:
      # Instructions, contracts and tools at the head of the branch this workflow runs from, not the pull request's
      # base commit: the review holds a PR to today's contract, and an older base may predate the tools.
      - name: Checkout the base (instructions, contracts, tools)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: base
          persist-credentials: false
      - name: Checkout the PR head (data only)
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.gate.outputs.head_repo }}
          ref: ${{ needs.gate.outputs.head_sha }}
          path: pr
          persist-credentials: false
          # A fork head under pull_request_target: checked out as data (Codex's commands run in its sandbox; see the
          # header).
          allow-unsafe-pr-checkout: true
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: diagnostics
          path: ctx-diag
      - name: Build the review context
        id: ctx
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.gate.outputs.pr }}
          HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
          PREV_SHA: ${{ needs.gate.outputs.prev_sha }}
          TREE_SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          # tools/recipes.py reads the workspace with `cargo metadata --offline`, which stable does; without this,
          # rust-toolchain.toml would install the pinned nightly and its components first.
          RUSTUP_TOOLCHAIN: stable
        run: |
          set -euo pipefail
          mkdir -p ctx out trace
          gh api "repos/$REPO/pulls/$PR" > ctx/pr-full.json
          base_ref=$(jq -r .base.ref ctx/pr-full.json)
          # The slag ledger's lessons in force (tools/review/ledger.py); its version goes into the footer marker.
          ledger=$(python3 base/tools/review/ledger.py accepted --repo "$REPO" --out ctx/ledger.md)
          # What the review runs under that a PR cannot change (tools/review/carry.py); also in the footer marker.
          tools=$(python3 base/tools/review/carry.py reviewer-id --root base)
          # A replacement pull request ("Supersedes #N", the same author) starts from the last review of #N. A dispatched
          # run is a full review and starts from nothing.
          prev_pr=$PR
          if [ -z "$PREV_SHA" ] && [ "$EVENT" != workflow_dispatch ]; then
            sup=$(python3 base/tools/review/carry.py supersedes --repo "$REPO" --pr-json ctx/pr-full.json || echo "none carry.py supersedes failed")
            if [ -n "$sup" ]; then echo "supersedes: $sup" | tee -a "$GITHUB_STEP_SUMMARY"; fi
            case "$sup" in ok\ *) read -r _ PREV_SHA prev_pr <<< "$sup" ;; esac
          fi
          mode=full
          carried=""
          if [ -n "$PREV_SHA" ] && [ "$PREV_SHA" != "$HEAD_SHA" ]; then
            gh api --paginate "repos/$REPO/pulls/$prev_pr/reviews?per_page=100" \
              --jq '[.[] | select(.user.login == "github-actions[bot]") | select(.body | contains("<!-- bloomery-review head_sha='"$PREV_SHA"'"))] | last | .body' > prev-review.md
            status=$(gh api "repos/$REPO/compare/$PREV_SHA...$HEAD_SHA" --jq .status 2>/dev/null || echo error)
            if [ "$status" = ahead ]; then
              # The last reviewed head is an ancestor of this one: only the commits since.
              gh api "repos/$REPO/compare/$PREV_SHA...$HEAD_SHA" -H 'Accept: application/vnd.github.diff' > ctx/diff.patch
              cp prev-review.md ctx/prev-review.md
              mode=incremental
            else
              # A rebase or a replacement: carry the approval, read the interdiff, or review it all (carry.py says why).
              # It leaves ctx/carry.json, and ctx/prev-review.md and ctx/interdiff.patch for the modes that read them.
              if ! line=$(python3 base/tools/review/carry.py decide --repo "$REPO" --head "$HEAD_SHA" --prev "$PREV_SHA" \
                    --prev-pr "$prev_pr" --prev-review prev-review.md --base-ref "$base_ref" --ledger "$ledger" --tools "$tools" --out ctx); then
                line="full: carry.py decide failed (see the log); a full review runs"
              fi
              echo "carry: $line" | tee -a "$GITHUB_STEP_SUMMARY"
              mode=${line%%:*}
              if [ "$mode" = carry ]; then carried=$PREV_SHA; fi
            fi
          fi
          if [ "$mode" != incremental ]; then
            gh api "repos/$REPO/pulls/$PR" -H 'Accept: application/vnd.github.diff' > ctx/diff.patch
          fi
          gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | "\(.status)\t+\(.additions)\t-\(.deletions)\t\(.filename)"' > ctx/files.txt
          gh api --paginate "repos/$REPO/issues?labels=review-bot&state=open&per_page=100" --jq '.[] | "#\(.number) \(.title)"' > ctx/open-issues.txt
          # The crates a card must check (tools/recipes.py pure-crates on the trusted tree), for the card label.
          python3 base/tools/review/post.py device --root base --out ctx/device-dirs.txt
          # tree_sha: the commit BASE_TREE is checked out at, which issue evidence links point into.
          jq --arg mode "$mode" --arg repo "$REPO" --arg tree "$TREE_SHA" --arg ledger "$ledger" --arg run "$GITHUB_RUN_ID" \
            --arg tools "$tools" --arg carried "$carried" \
            '{number, title, body, author: .user.login, repo: $repo, base_sha: .base.sha, head_sha: .head.sha,
              tree_sha: $tree, mode: $mode, ledger: $ledger, run: $run, tools: $tools, carried_from: $carried}' ctx/pr-full.json > ctx/pr.json
          rm ctx/pr-full.json
          # A carry has no reviewer: post.py writes its review, and the check below decides the event as for any review.
          if [ "$mode" = carry ]; then
            python3 base/tools/review/post.py carry --carry ctx/carry.json --prev-review ctx/prev-review.md --out out
          fi
          if [ -f ctx-diag/diagnostics.md ]; then cp ctx-diag/diagnostics.md ctx/; else
            echo "The diagnostics job did not finish; no dryer or crapper results for this review." > ctx/diagnostics.md; fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "context: mode=$mode diff=$(wc -l < ctx/diff.patch) lines files=$(wc -l < ctx/files.txt)" | tee -a "$GITHUB_STEP_SUMMARY"
      # The logins: each secret is read in this step only. The Codex login becomes CODEX_HOME/auth.json, outside the
      # trees and OUT, and every long string in it is masked in the log; the cleanup step below deletes it.
      - name: Logins
        id: logins
        if: steps.ctx.outputs.mode != 'carry'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          CODEX_HOME: ${{ runner.temp }}/codex-home
        run: |
          set -euo pipefail
          claude=false; codex=false
          [ -z "$ANTHROPIC_API_KEY" ] || claude=true
          if [ -n "$CODEX_AUTH_JSON" ]; then
            mkdir -m 700 "$CODEX_HOME"
            (umask 077; printenv CODEX_AUTH_JSON > "$CODEX_HOME/auth.json")
            jq -r '.. | strings | select(length >= 16)' "$CODEX_HOME/auth.json" | while IFS= read -r v; do
              echo "::add-mask::$v"
            done || echo "::warning::CODEX_AUTH_JSON is not JSON"
            codex=true
          fi
          case "$REVIEW_ENGINE" in
            claude|codex) ;;
            *) echo "::warning::REVIEW_ENGINE is '$REVIEW_ENGINE', not claude or codex; claude goes first" ;;
          esac
          printf 'claude=%s\ncodex=%s\n' "$claude" "$codex" >> "$GITHUB_OUTPUT"
          echo "logins: claude=$claude codex=$codex; tried first: $REVIEW_ENGINE" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache@v4
        if: steps.ctx.outputs.mode != 'carry'
        with:
          path: ~/.npm
          key: npm-claude-code-${{ env.CLAUDE_CODE_VERSION }}-codex-${{ env.CODEX_VERSION }}
      # A failed install leaves that engine out (run.py finds no CLI) and the other one still runs.
      - name: Install Claude Code
        if: steps.logins.outputs.claude == 'true'
        continue-on-error: true
        run: npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
      # The Codex sandbox is bubblewrap, which needs unprivileged user namespaces; Ubuntu's AppArmor gate denies them.
      # When it cannot start, run-codex.sh's sandbox check fails and Claude runs.
      - name: Install Codex
        if: steps.logins.outputs.codex == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          npm install -g "@openai/codex@$CODEX_VERSION"
          if [ "$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || echo 1)" != 1 ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" != 0 ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # run.py prints which engine did each role and why another did not; exit 75 is "no engine could", which ends the
      # job without a review and with a warning instead of failing it.
      - name: Review
        id: review
        if: steps.ctx.outputs.mode != 'carry'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
          CODEX_HOME: ${{ runner.temp }}/codex-home
        run: |
          set -o pipefail
          rc=0
          python3 base/tools/review/run.py reviewer "$PWD/base" "$PWD/pr" "$PWD/ctx" "$PWD/out" "$PWD/trace" \
            | tee -a "$GITHUB_STEP_SUMMARY" || rc=$?
          echo "done=$([ "$rc" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 75 ]; then
            echo "::warning::no engine could run the reviewer; no review this run (see the summary)"
            exit 0
          fi
          exit "$rc"
      - name: Validate
        id: validate
        if: steps.review.outputs.done == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
          CODEX_HOME: ${{ runner.temp }}/codex-home
        run: |
          set -o pipefail
          rc=0
          python3 base/tools/review/run.py validator "$PWD/base" "$PWD/pr" "$PWD/ctx" "$PWD/out" "$PWD/trace" \
            | tee -a "$GITHUB_STEP_SUMMARY" || rc=$?
          echo "done=$([ "$rc" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 75 ]; then
            echo "::warning::no engine could run the validator; no review this run (see the summary)"
            exit 0
          fi
          exit "$rc"
      - name: Check the output
        id: check
        if: steps.validate.outputs.done == 'true' || steps.ctx.outputs.mode == 'carry'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CODEX_HOME: ${{ runner.temp }}/codex-home
        run: |
          python3 base/tools/review/post.py check --out out --diff ctx/diff.patch --pr-json ctx/pr.json --files ctx/files.txt \
            --device ctx/device-dirs.txt \
            --base "$PWD/base" --secret-env ANTHROPIC_API_KEY --secret-file "$CODEX_HOME/auth.json" \
            --usage trace/reviewer.usage.json --usage trace/validator.usage.json
      - name: Delete the Codex login
        if: always()
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
        run: rm -rf "$CODEX_HOME"
      # Token and tool accounting for later optimization: the summary lines here, the full transcripts and
      # tools/review/usage.py's JSON in the review-trace artifact (also on a failed run).
      - name: Record usage
        if: always()
        run: |
          for r in reviewer validator; do
            [ -f "trace/$r.usage.json" ] && python3 -c "import json,sys;u=json.load(open(sys.argv[1]));print(f\"{u['role']}: engine={u.get('engine', 'claude')} turns={u['num_turns']} requests={u['requests']} cost_usd={u['cost_usd']} ctx_max={u['context_max']} ctx_sum={u['context_sum']} out={u['tokens']['output']} tools={u['tools']} denied={u['denied']} reads={u['reads_distinct']}\")" "trace/$r.usage.json"
          done | tee -a "$GITHUB_STEP_SUMMARY"
          wc -l ctx/diff.patch | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-trace
          path: trace/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: steps.check.outcome == 'success'
        with:
          name: review
          path: |
            out/review.md
            out/decision.txt
            out/event.txt
            out/labels.json
            out/gpu.json
            out/comments.json
            out/head_sha.txt
            out/usage.txt
            out/issues.json
            out/base_sha.txt
            out/removed.json
            out/lessons.json
            out/aims.json
            ctx/diff.patch
            ctx/pr.json
            ctx/files.txt
            ctx/device-dirs.txt
            ctx/carry.json
            ctx/interdiff.patch
          retention-days: 90   # the learner reads removed.json, lessons.json and aims.json back (tools/review/signals.py)

  post:
    needs: [gate, review]
    if: needs.review.result == 'success' && needs.review.outputs.reviewed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout the base (post.py)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          sparse-checkout: tools/review
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: review
          path: art
      - name: Post the review
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.gate.outputs.pr }}
        run: |
          set -euo pipefail
          # The head may have moved while the review ran; a review of an old head is not posted (the next run covers it).
          now=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          reviewed=$(cat art/out/head_sha.txt)
          if [ "$now" != "$reviewed" ]; then
            echo "head moved from $reviewed to $now; not posting" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # A release freeze (an open release-freeze issue by the owner) holds the approval of a needs-gpu change.
          python3 tools/review/post.py freeze --repo "$REPO" --out freeze.txt | tee -a "$GITHUB_STEP_SUMMARY"
          python3 tools/review/post.py check --out art/out --diff art/ctx/diff.patch --pr-json art/ctx/pr.json \
            --files art/ctx/files.txt --device art/ctx/device-dirs.txt --freeze freeze.txt
          # Defects the reviewer proved outside this PR become issues labelled review-bot (deduplicated by title).
          python3 tools/review/post.py issues --out art/out --repo "$REPO" --pr "$PR" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 tools/review/post.py post --out art/out --repo "$REPO" --pr "$PR" | tee -a "$GITHUB_STEP_SUMMARY"
          # The card label: needs-gpu or gpu-evidence (gpu-verified is a maintainer's; the bot never touches it).
          python3 tools/review/post.py labels --out art/out --repo "$REPO" --pr "$PR" | tee -a "$GITHUB_STEP_SUMMARY"
