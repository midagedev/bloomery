# Images the release: on a v* tag push (or a manual run naming one), downloads that
# release's own tarball and .sha256 and builds tools/release/Dockerfile around them,
# so the image's bytes are the release's bytes, checked. The first publish creates
# the package private; make it public once in its package settings.
name: Docker image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag to image (vX.Y.Z)"
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-publish:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the release's version and sha256
        id: rel
        run: |
          set -eu
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          v="${tag#v}"
          base="https://github.com/${{ github.repository }}/releases/download/${tag}"
          curl -fsSL "$base/bloomery-${v}-linux-x86_64-cuda-sm86.tar.gz.sha256" -o rel.sha256
          sha=$(awk '{print $1}' rel.sha256)
          [ "${#sha}" = 64 ] || { echo "no digest in the release's .sha256" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "tags=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${v},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: tools/release
          platforms: linux/amd64
          push: true
          tags: ${{ steps.rel.outputs.tags }}
          build-args: |
            VERSION=${{ steps.rel.outputs.version }}
            SHA256=${{ steps.rel.outputs.sha256 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
