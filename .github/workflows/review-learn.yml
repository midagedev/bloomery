# Shingler's weekly learner (the review bot's): what happened after its reviews becomes lessons in the knowledge ledger (one open
# issue labelled review-ledger; tools/review/ledger.py). Design: .github/review/README.md.
#
# No person is in the loop. Signals are outcomes code can see (tools/review/signals.py); the model only proposes
# (candidates.json); ledger.py writes the issue body, puts each candidate in force with its guards, renews a lesson
# that was used and expires one that was not. A maintainer's one move is a veto (strike a line). The logins and the
# issues-write token never share a job. The engines are chosen as in review.yml (REVIEW_ENGINE, an ordered list).
name: Shingler learner

on:
  schedule:
    - cron: '0 21 * * 0'   # Sunday 21:00 UTC, Monday 06:00 KST
  workflow_dispatch:
    inputs:
      days:
        description: The window in days
        required: false
        default: '8'

permissions:
  contents: read

concurrency:
  group: review-learn
  cancel-in-progress: false

env:
  CLAUDE_CODE_VERSION: 2.1.284
  REVIEW_MODEL: claude-sonnet-5-5
  REVIEW_MODEL_GLM: glm-5.3
  CODEX_VERSION: 0.160.0
  REVIEW_CODEX_MODEL: gpt-6.1-sol
  REVIEW_ENGINE: ${{ vars.REVIEW_ENGINE || 'glm,claude,codex' }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read   # the review runs' artifacts (removed.json, lessons.json)
    outputs:
      has_signals: ${{ steps.s.outputs.has_signals }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: base
          fetch-depth: 0   # git blame over the window
          persist-credentials: false
      - id: s
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DAYS: ${{ inputs.days || '8' }}
        run: |
          set -euo pipefail
          s=$(date +%s)
          python3 base/tools/review/signals.py --repo "$REPO" --git "$PWD/base" --days "$DAYS" --ref HEAD --out ctx \
            | tee -a "$GITHUB_STEP_SUMMARY"
          python3 base/tools/review/ledger.py fetch --repo "$REPO" --out ctx/ledger-body.md | tee -a "$GITHUB_STEP_SUMMARY"
          echo "collect: $(( $(date +%s) - s )) s" >> "$GITHUB_STEP_SUMMARY"
          echo "has_signals=$(cat ctx/has_signals.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: signals
          path: ctx

  learn:
    needs: collect
    if: needs.collect.outputs.has_signals == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60   # the learner may run on all three engines, 3 x 15 minutes (tools/review/run.py MINUTES)
    outputs:
      learned: ${{ steps.learn.outputs.done }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: base
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: signals
          path: ctx
      # The logins, as in review.yml: each secret is read in this step to say which engines have one, and again in the
      # step that runs the engines.
      - name: Logins
        id: logins
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          CODEX_HOME: ${{ runner.temp }}/codex-home
        run: |
          set -euo pipefail
          glm=false; claude=false; codex=false
          if [ -n "$ZAI_API_KEY" ]; then
            echo "::add-mask::$ZAI_API_KEY"
            glm=true
          fi
          [ -z "$ANTHROPIC_API_KEY" ] || claude=true
          if [ -n "$CODEX_AUTH_JSON" ]; then
            mkdir -m 700 "$CODEX_HOME"
            (umask 077; printenv CODEX_AUTH_JSON > "$CODEX_HOME/auth.json")
            jq -r '.. | strings | select(length >= 16)' "$CODEX_HOME/auth.json" | while IFS= read -r v; do
              echo "::add-mask::$v"
            done || echo "::warning::CODEX_AUTH_JSON is not JSON"
            codex=true
          fi
          set -f
          for w in $(printf '%s' "$REVIEW_ENGINE" | tr 'A-Z,' 'a-z '); do
            case "$w" in
              glm|claude|codex) ;;
              *) echo "::warning::REVIEW_ENGINE names '$w', which is no engine (glm, claude, codex); it is skipped" ;;
            esac
          done
          set +f
          printf 'glm=%s\nclaude=%s\ncodex=%s\n' "$glm" "$claude" "$codex" >> "$GITHUB_OUTPUT"
          echo "logins: glm=$glm claude=$claude codex=$codex; order: $REVIEW_ENGINE (engines it leaves out follow as glm, claude, codex)" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-claude-code-${{ env.CLAUDE_CODE_VERSION }}-codex-${{ env.CODEX_VERSION }}
      # A failed install leaves that engine out, as in review.yml. glm runs the claude CLI.
      - name: Install Claude Code
        if: steps.logins.outputs.claude == 'true' || steps.logins.outputs.glm == 'true'
        continue-on-error: true
        run: npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
      - name: Install Codex
        if: steps.logins.outputs.codex == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          npm install -g "@openai/codex@$CODEX_VERSION"
          if [ "$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || echo 1)" != 1 ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" != 0 ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # With no engine able to run (run.py exit 75) there are no candidates this week: the update still runs, and its
      # run line says "learner not run".
      - name: Learn
        id: learn
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
          CODEX_HOME: ${{ runner.temp }}/codex-home
        run: |
          set -o pipefail
          mkdir -p out trace
          rc=0
          python3 base/tools/review/run.py learner "$PWD/base" "$PWD/base" "$PWD/ctx" "$PWD/out" "$PWD/trace" \
            | tee -a "$GITHUB_STEP_SUMMARY" || rc=$?
          echo "done=$([ "$rc" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 75 ]; then
            echo "::warning::no engine could run the learner; no candidates this week (see the summary)"
            exit 0
          fi
          exit "$rc"
      - name: Delete the Codex login
        if: always()
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
        run: rm -rf "$CODEX_HOME"
      - name: Record usage
        if: always()
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json, os
          p = "trace/learner.usage.json"
          if os.path.exists(p):
              u = json.load(open(p))
              print(f"learner: {u.get('engine', 'claude')} {u['subtype']} turns={u['num_turns']} cost_usd={u['cost_usd']} "
                    f"ctx_max={u['context_max']} ctx_sum={u['context_sum']} tools={u['tools']}")
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: learn-trace
          path: trace
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: steps.learn.outputs.done == 'true'
        with:
          name: candidates
          path: |
            out/candidates.json
            trace/learner.usage.json

  update:
    needs: [collect, learn]
    if: always() && needs.collect.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          sparse-checkout: tools/review
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: signals
          path: ctx
      - uses: actions/download-artifact@v4
        if: needs.learn.outputs.learned == 'true'
        with:
          name: candidates
          path: cand
      - name: Update the ledger
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Runs every week, with or without a learner run: lessons in force age by their measured use
          # (ctx/lesson-stats.json beside the stats line).
          python3 tools/review/ledger.py update --repo "$REPO" --candidates cand/out/candidates.json \
            --stats ctx/stats.md --usage cand/trace/learner.usage.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
