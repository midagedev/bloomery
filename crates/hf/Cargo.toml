[package]
name = "bloomery-hf"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "Hugging Face repository discovery, verified cached fetching, checkpoint configuration and tensor normalization"

[lib]
name = "hf"

[lints]
workspace = true

[dependencies]
bloomery-gguf = { path = "../gguf" }
# A normalized tensor's new memory is advised onto huge pages.
bloomery-os.workspace = true
# `catalog` orders a model's formats by the placement's own card class, the one owner of it.
bloomery-placement = { path = "../placement" }
# `dspark` returns the draft's geometry as the runtime's `DsparkShape`; the runtime depends on the model
# description only, so hf does not close a cycle.
bloomery-runtime = { path = "../runtime" }
bloomery-safetensors = { path = "../safetensors" }
# `quant_config` matches compressed-tensors' `re:` module patterns.
regex = "1.13.1"
serde_json = "=1.0.151"
sha1 = "0.10"
thiserror = { workspace = true }

[dev-dependencies]
# The checkpoint headers in tests/fixtures are kept gzipped.
flate2 = "1.1.10"
sha2 = { workspace = true }
# The vocabulary the folder reader derives runs through the tokenizer in tests/.
bloomery-tokenizer = { path = "../tokenizer" }
