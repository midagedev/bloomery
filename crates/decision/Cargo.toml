[package]
name = "bloomery-decision"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "The decision models' request encoders, heads and answers on the host: Clef's joint schema head in f32, and the label readout of lev"

[lib]
name = "decision"

[[bin]]
name = "decision_encode"
path = "src/bin/decision_encode.rs"

[[bin]]
name = "decision_answer"
path = "src/bin/decision_answer.rs"
required-features = ["safetensors"]

[[test]]
name = "clef"
required-features = ["safetensors"]

[lints]
workspace = true

[dependencies]
bloomery-gguf = { path = "../gguf" }
bloomery-hf = { path = "../hf", optional = true }
bloomery-jinja = { path = "../jinja" }
bloomery-tokenizer = { path = "../tokenizer" }
bloomery-vision = { path = "../vision" }
# The label models' prompt templates take serde_json values (the jinja crate's input). `preserve_order`
# keeps an object's keys in the order they were built in; no other feature is wanted here (the request
# reader in `json` is ours, for exact integers).
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
thiserror.workspace = true
matrixmultiply.workspace = true

[features]
# The release's head file (`joint_head.safetensors`): `ClefHead::open`, `from_safetensors` and the
# `Weights` impl over `hf::safetensors`. The request, answer, encode, generative, label, render and rows
# code reads no checkpoint, so a crate that only serves a request (`bloomery-serve`) leaves it off and
# its builds do not key `bloomery-hf`.
safetensors = ["dep:bloomery-hf"]
