[package]
name = "bloomery-gguf"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
name = "gguf"

[lints]
workspace = true

[dependencies]
memmap2.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The lib test reads a thread's own page faults.
bloomery-os.workspace = true
libc.workspace = true
# The dequant oracle's sets open through their refset family; refset reads the GGUF files
# through this crate, so the tests link the lib once and refset beside it.
bloomery-refset = { path = "../refset" }

# sha256 on an aarch64 host runs the CPU's SHA2 instructions (sha2's `asm`, assembled by the native C toolchain);
# elsewhere, including the Mac's x86_64-linux cross check, which has no cross C compiler, the portable path.
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { workspace = true, features = ["asm"] }
