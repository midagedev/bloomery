[package]
name = "bloomery-gpu"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[lints]
workspace = true

[dependencies]
cuda-device.workspace = true
cuda-host.workspace = true
# The host runtime cutile-rs and cuda-oxide share, from cuda-oxide's repository and rev (the workspace entry).
cuda-core.workspace = true
# Dependency direction is gpu -> model/gguf only (docs/gpu-design.md decision 1):
# metadata readers and `Derived` are reused, and model never learns about gpu.
bloomery-model = { path = "../model" }
bloomery-gguf = { path = "../gguf" }
# The device contract: the fault table every backend shares, and the `Device` this crate implements (`device`).
bloomery-device = { path = "../device" }
# The chain plans the card bodies read, as host data a backend with no CUDA takes too (`chain::arch`).
bloomery-chain.workspace = true
# The typed host-tier settings a binary's one lever reading makes (`HostCfg`).
bloomery-levers = { path = "../levers" }
# Host only: Qwen3.8's PLE rows are the n-gram hash's (`engram::Hash::ple_rows_into`).
bloomery-engram = { path = "../engram" }
# Host only: a sequence's rotation table holds the M-RoPE rows of its images (`vision::mrope::SeqRows`).
bloomery-vision = { path = "../vision" }
# Host only: the qwen3moe chain and pass are walks of the schedules' overlap (`runtime::sched`).
bloomery-runtime = { path = "../runtime" }
# Host only: the tier link's RDMA end posts through the system's `libibverbs`, loaded at run time.
bloomery-verbs = { path = "../verbs" }
# The expert tier's page shared with a tier node's process through a /dev/shm file (`graph::MappedHost`).
memmap2.workspace = true
libc.workspace = true
# A release binary's `.oxart.ptx` section, read when the driver refuses the cubins its `.oxart` carries
# (`bundle_module`): the section through object's ELF reader and its bundles through the container parser
# cuda-core's loader links. Both take the features cuda-core already turns on.
oxide-artifacts.workspace = true
object = { version = "0.36", default-features = false, features = ["read", "std"] }
# The huge-page advice for large new host memory (`tensor::host_filled`, `upload::pack_planes`).
bloomery-os.workspace = true
# The pinned pool the hybrid host tier waits on and computes with (the CPU
# engine dispatches its expert matmuls on the same pool).
bloomery-threads = { path = "../threads" }
# Host only: the stream lanes turn NVFP4 rows' codes into the card's block order (`qdot::nvfp4_codes_to_blocks`).
bloomery-qdot = { path = "../qdot" }
# One feature set for every build of this crate: png's flate2 and serve's serde_json turn on these crates'
# `default`, the `--features gpu` builds alone do not, and a feature list is part of cargo's unit hash, so
# without these lines the crate and its cuda-* chain compile once per feature set.
crc32fast = "1.5"
indexmap = "2.14"
