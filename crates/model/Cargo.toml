[package]
name = "bloomery-model"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
name = "model"

[lints]
workspace = true

[dependencies]
bloomery-gguf = { path = "../gguf" }
bloomery-levers = { path = "../levers" }
bloomery-models = { path = "../models" }
# The OS calls the placement path makes (the affinity mask, the page-cache
# advice, the resident-page count) are the one owner's.
bloomery-os.workspace = true
# The placement planner, as a pure crate so its tests run on the Mac; this
# crate re-exports it at `placement` and keeps the parts the Mac cannot run
# (host_lock, workstation::host_available) beside the re-export.
bloomery-placement = { path = "../placement" }
bloomery-qdot = { path = "../qdot" }
bloomery-threads = { path = "../threads" }
# The plans count the stores by the rules the card bodies allocate them by (`runtime::stores`).
# The runtime depends on the model description alone, so the edge makes no cycle.
bloomery-runtime = { path = "../runtime" }
# The coverage check asks the tokenizer which pre-tokenizers it runs.
bloomery-tokenizer = { path = "../tokenizer" }
libc = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
# The mistral-large4 metadata gate builds its header-only GGUF from the
# checked-in header tables (tests/mistrallarge4_hdr.kv.json); the version is
# the tree's pin.
serde_json = "=1.0.151"
# The open gate builds the hash constants and opens the tables the way the card engine does.
bloomery-engram = { path = "../engram" }
# The gates read the oracle sets through the reference-set reader, which checks each set's
# provenance. It depends on the GGUF reader only, so the edge makes no cycle.
bloomery-refset = { path = "../refset" }
