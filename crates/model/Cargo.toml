[package]
name = "bloomery-model"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
name = "model"

[lints]
workspace = true

[dependencies]
bloomery-gguf = { path = "../gguf" }
# The fixture fetch reads a source's headers from the hub by range through the hf crate's curl client.
bloomery-hf = { path = "../hf" }
bloomery-levers = { path = "../levers" }
bloomery-models = { path = "../models" }
# The placement planner, as a pure crate so its tests run on the Mac; this
# crate re-exports it at `placement` and keeps the parts the Mac cannot run
# (host_lock, workstation::host_available) beside the re-export.
bloomery-placement = { path = "../placement" }
bloomery-qdot = { path = "../qdot" }
# The fixture bin names a family by its directory, the one `refset::fixture::dir_of` reads from tools/fixture-dirs.tsv, and the
# gates read the oracle sets through the same reader, which checks each set's provenance. It depends on the GGUF reader only, so the
# edge makes no cycle.
bloomery-refset = { path = "../refset" }
bloomery-threads = { path = "../threads" }
# The plans count the stores by the rules the card bodies allocate them by (`runtime::stores`).
# The runtime depends on the model description alone, so the edge makes no cycle.
bloomery-runtime = { path = "../runtime" }
# The coverage check asks the tokenizer which pre-tokenizers it runs.
bloomery-tokenizer = { path = "../tokenizer" }
libc = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
