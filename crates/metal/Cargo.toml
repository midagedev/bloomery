[package]
name = "bloomery-metal"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
build = "build.rs"

[lib]
name = "bloomery_metal"

[[bin]]
name = "gate_metal_device"
path = "src/bin/gate_metal_device.rs"

[[bin]]
name = "gate_metal_qwen35moe_kernels"
path = "src/bin/gate_metal_qwen35moe_kernels.rs"

[[bin]]
name = "gate_metal_qwen35moe_e2e"
path = "src/bin/gate_metal_qwen35moe_e2e.rs"

[[bin]]
name = "metal_matvec_time"
path = "src/bin/metal_matvec_time.rs"

[lints]
workspace = true

[dependencies]
# The contract this backend implements, and the placement's terms (the
# census of the devices a backend opens).
bloomery-device = { path = "../device" }
bloomery-placement = { path = "../placement" }

# The Objective-C bindings, macOS only: on another operating system the
# library is empty and the gate bin only refuses, so these are never built.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
objc2-metal = { workspace = true, features = ["MTLFunctionConstantValues", "MTLDataType"] }
dispatch2 = { workspace = true }
# The fixture's tensors and their dequantization: the kernel gate's oracle.
bloomery-gguf = { path = "../gguf" }
# The session: the qwen35moe walk and plan it runs (`ChainOps`), and the
# file's description the plan is read from.
bloomery-chain.workspace = true
bloomery-model = { path = "../model" }
# Where the fixture file sits (the one owner of the fixture root and layout),
# and the e2e gate's oracle: ik's reference sets, opened through their family.
bloomery-refset = { path = "../refset" }
# The session as the generation loop's target (`arch/qwen3moe/target.rs`):
# the loop, its stop rule and its cut reasons, all host-only.
bloomery-runtime = { path = "../runtime" }

[build-dependencies]
# The fault site's table, the one owner the generated header is written
# from.
bloomery-device = { path = "../device" }
