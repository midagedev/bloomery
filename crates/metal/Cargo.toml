[package]
name = "bloomery-metal"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
build = "build.rs"

[lib]
name = "bloomery_metal"

[[bin]]
name = "gate_metal_device"
path = "src/bin/gate_metal_device.rs"

[[bin]]
name = "gate_metal_qwen35moe_kernels"
path = "src/bin/gate_metal_qwen35moe_kernels.rs"

[[bin]]
name = "gate_metal_qwen35moe_e2e"
path = "src/bin/gate_metal_qwen35moe_e2e.rs"

[[bin]]
name = "metal_matvec_time"
path = "src/bin/metal_matvec_time.rs"

[[bin]]
name = "metal_attention_time"
path = "src/bin/metal_attention_time.rs"

[[bin]]
name = "metal_gemm_time"
path = "src/bin/metal_gemm_time.rs"

[[bin]]
name = "metal_rows_time"
path = "src/bin/metal_rows_time.rs"

[[bin]]
name = "generate_metal"
path = "src/bin/generate_metal.rs"

[[bin]]
name = "bloomery-serve-metal"
path = "src/bin/bloomery_serve_metal.rs"

[[bin]]
name = "metal_scan"
path = "src/bin/metal_scan.rs"
required-features = ["pipeline-scan"]

# The Metal move proof (tools/metal-compare.sh): what a change that should not move a kernel is
# checked by, in place of a timing sitting. Both are off in every build the gates and the
# serve binary use, so their host code is the shipped code.
[features]
default = []
# Each compute pipeline the engine builds carries its entry and function-constant values.
pipeline-label = []
# The pipelines the engine builds are recorded as they are built: `metal_scan` serializes each
# into a binary archive and hashes it.
pipeline-scan = [
    "pipeline-label",
    "objc2-metal/MTLBinaryArchive",
    "objc2-foundation/NSURL",
]
# Every dispatch, binding, `setBytes` value, barrier and commit/wait/event of a run is written
# as text (`generate_metal --encode-trace FILE`).
encode-trace = ["pipeline-label"]
# The host launch geometry is Qwen3-30B-A3B's (`instance::QWEN3MOE_A3B`) instead of Qwen3.6's: a
# build opens that model's files and refuses the other's by name.
host-qwen3moe-a3b = []

[lints]
workspace = true

[dependencies]
# The contract this backend implements, and the placement's terms (the
# census of the devices a backend opens).
bloomery-device = { path = "../device" }
bloomery-placement = { path = "../placement" }
# The generation loop's target (`arch/qwen3moe/target.rs`) and the server's
# engine over any target (`server.rs`, every OS: host code only): the loop,
# its stop rule and its cut reasons, and the HTTP API's `Engine`, the file's
# vocabulary and the sampler chain, every seat's owners.
bloomery-runtime = { path = "../runtime" }
bloomery-serve = { path = "../serve" }
# The shape table the kernels' instances are rows of (`src/instance.rs`), and
# the description a file's shape is matched on: host code, every OS.
bloomery-models = { path = "../models" }

# The Objective-C bindings, macOS only: on another operating system the
# library is empty and the gate bin only refuses, so these are never built.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
objc2-metal = { workspace = true, features = ["MTLFunctionConstantValues", "MTLDataType", "MTLResidencySet"] }
dispatch2 = { workspace = true }
# The fixture's tensors and their dequantization: the kernel gate's oracle.
bloomery-gguf = { path = "../gguf" }
# The host's available memory, which the census reads beside the working set.
bloomery-os.workspace = true
# The session: the qwen35moe walk and plan it runs (`ChainOps`), and the
# file's description the plan is read from.
bloomery-chain.workspace = true
bloomery-model = { path = "../model" }
# The model file a session opens, a GGUF split or a checkpoint folder behind one
# owner (`ModelFile`, `Weights`): this crate parses no checkpoint of its own.
bloomery-model-hf = { path = "../model-hf" }
# `--hf REPO`: the hub's fetch into the cache, and the rule that a model is named once (`model_arg`).
bloomery-hf = { path = "../hf" }
# Where the fixture file sits (the one owner of the fixture root and layout),
# and the e2e gate's oracle: ik's reference sets, opened through their family.
bloomery-refset = { path = "../refset" }
# The generation CLI's own owners, host-only: the file's vocabulary (the
# prompt's encode, the streamed decode, the end-of-generation set) and the
# lever rows a binary parses at main (this CLI acts on none).
bloomery-tokenizer = { path = "../tokenizer" }
bloomery-levers = { path = "../levers" }

[build-dependencies]
# The fault site's table, the one owner the generated header is written
# from.
bloomery-device = { path = "../device" }
# The shape table the registered instances are rows of: one header and one
# compile per instance.
bloomery-models = { path = "../models" }
