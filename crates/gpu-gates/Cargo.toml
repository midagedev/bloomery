# serve-preflight: the launcher's checks before the model fetch, the unit tests of this bin (`cargo test --bin`). A `[[test]]` target
# would make every `cargo test` that selects it compile and link every bin of the package, replacing the ones other lanes run.
[[bin]]
name = "gate_serve_preflight"
required-features = ["glm5next", "clef", "vision", "mimo2", "solar2", "minimaxm3", "flint", "mistrallarge4", "gemma-embedding2", "hf"]

[[bin]]
name = "gate_qwen38_media"
required-features = ["vision", "deepseek41"]

# raon-body: the Raon-1 end-to-end gate.
[[bin]]
name = "gate_raon1_e2e"
required-features = ["gpu"]

# raon-attn: Raon-1's RDA and gated latent attention against the HF model in f64.
[[bin]]
name = "gate_raon1_attn"
required-features = ["gpu"]

# kimik3kda: Kimi K3's KDA layer through `mixer_kda` at 2 and 96 heads of 128 against llama.cpp's graph in f64.
[[bin]]
name = "gate_kimi_k3_kda"
required-features = ["gpu"]

# dfl-wire: Raon-1's DFlash2 draft: its load, the V4.1 DSpark file refused, and its first block against the host oracle's.
[[bin]]
name = "gate_raon1_dflash"
required-features = ["gpu"]

# kimik3-mla: Kimi K3's gated MLA layer on the card (latent_gated's launches at K3's geometry) against the llama.cpp graph in f64.
[[bin]]
name = "gate_kimi_k3_mla"
# kimik3-dsa: Kimi K3.1's selected attention on the card (the index key, the lightning indexer's list, the latent core over the
# list's rows) against host rules and the llama.cpp graph in f64.
[[bin]]
name = "gate_kimi_k3_dsa"
required-features = ["gpu"]
# kimik3-moe: Kimi K3's routed block (the common routed block with the latent pair, the routed-sum norm and the gated shared stack)
# against the llama.cpp graph in f64, on the fixture's routed layers and on random tensors at the real widths.
[[bin]]
name = "gate_kimi_k3_moe"
required-features = ["gpu"]

# kimik3-body: Kimi K3's decode step (the delta and gated latent layers, the latent MoE blocks, the AttnRes mixes, the head) over the fixture file against mainline llama.cpp's node dumps of it.
[[bin]]
name = "gate_kimi_k3_e2e"
required-features = ["gpu"]

# kimik3pp: Kimi K3's pass of up to eight rows through the chain, each row the decode step's bits, over the fixture file.
[[bin]]
name = "gate_kimi_k3_pp"
required-features = ["gpu"]

# Kimi K3's end-to-end decode CLI: a prompt of ids or text walked one id a step, then greedy ids (gate_kimi_k3_e2e runs it).
[[bin]]
name = "generate_kimi_k3"
required-features = ["gpu"]

# kimik3place: Kimi K3's placed load (the stage card, the expert tier card in process and on a loopback node, the host row) against the whole-card body, over the fixture file.
[[bin]]
name = "gate_kimi_k3_place"
required-features = ["gpu"]

# kimik3-imatrix: Kimi K3's own prompt walk's importance matrix (generate_kimi_k3 --imatrix) against llama-imatrix's on the fixture: names, counts, the
# column sums within the band derived in the gate, and bloomery-quantize over it.
[[bin]]
name = "gate_kimi_k3_imatrix"
required-features = ["gpu"]

# exaone-e2e: the K-EXAONE-2.0 fixture GGUF's whole decode chain of the composed program against
# the patched llama.cpp tree's node dumps of the same file.
[[bin]]
name = "gate_exaone_e2e"
required-features = ["flint"]

# generate_exaone: K-EXAONE-2.0's collecting CLI — the importance matrix of a text corpus off this
# engine's own prompt batch, with the host tier's picks collected (the box's bootstrap file needs
# it: nearly every routed expert runs on the host).
[[bin]]
name = "generate_exaone"
required-features = ["flint"]

# ppl_exaone: K-EXAONE-2.0's loss tool — the engine's run of a GGUF over a fixed id file, written as
# ik's KL-divergence base file, which kld_diff reads (mean KLD, p99, top-1, PPL of one file against another).
[[bin]]
name = "ppl_exaone"
required-features = ["flint"]

# ppl_ds41: the V4.1 loss tool — the engine's run of a DeepSeek-V4.1-Flash GGUF over a fixed id list or an ik base's ids,
# written as the same base file; the one reader of every file of the family (ik reads no MXFP4 or MXFP8 file of it).
[[bin]]
name = "ppl_ds41"
required-features = ["deepseek41"]

# exaone-kld: the loss tool's walk on the fixture GGUFs — its records held to an independent run's rows,
# the same bytes twice, and a copy with its logits moved by a known amount.
[[bin]]
name = "gate_exaone_kld"
required-features = ["flint"]

# exaone-pp: the fixture GGUF's prompt sets through the program's prompt batch against the same
# ids run one decode step at a time.
[[bin]]
name = "gate_exaone_pp"
required-features = ["flint"]

# exaone-verify: the program's verify pass of two rows (one layer apart, the step's own launches per
# row) against two decode steps, through the engine's session, and a lookup draft over it.
[[bin]]
name = "gate_exaone_verify"
required-features = ["flint"]

# exaone-serve: the exaone-moe seat of bloomery-serve (the flint seat, the file's router row
# picking K-EXAONE's body) on the fixture GGUF: one chat turn with its reasoning split at the
# model's own tags, a tools request served, one tool call round-tripped through the file's own
# template.
[[bin]]
name = "gate_exaone_serve"
required-features = ["deepseek41", "flint"]
# hy4-attn: Hy4-flash's latent attention on the card (the sink, window and selected-list forms of the 576/512 walk) and its
# 256-a-head output gate, seeded inputs, against an f64 rule of llama.cpp's `build_attention`.
[[bin]]
name = "gate_hy4_attn"
required-features = ["gpu"]

# ernie55-hca: ERNIE 5.5's HCA attention sub-layer on the card over the common window ⧺ compressed attention, the compressor
# and the tail rope, with its VHA head mix, grouped output and gate; seeded inputs, against an f64 rule of the reference.
[[bin]]
name = "gate_ernie55_hca"
required-features = ["ernie55"]

[[bin]]
name = "gate_hy4_e2e"
required-features = ["hy4"]

# ernie55-e2e: ERNIE 5.5 Flash Preview's whole program on one card over the fixture cut (the card arm with the prompt pass,
# the hosted arm through the common host tier) against the numpy writer's sets `fx-np-ernie55`. Fixture tier only.
[[bin]]
name = "gate_ernie55_e2e"
required-features = ["ernie55", "checkpoint"]

# hy4-pp: the prompt batch (one pass a layer over every row, the grouped int8 GEMMs) against the decode chain on the fixture file.
[[bin]]
name = "gate_hy4_pp"
required-features = ["hy4"]

# ernie55-moe: ERNIE 5.5's latent mixture of experts on the card (the two-router sigmoid selection with the learned scale, the latent
# pair, the MXFP4 experts on the common card leg under SiTU, the routed sum's norm, the shared expert) and its split with the common host
# tier, seeded inputs at the released file's shapes against f64 rules of the reference, no model file.
[[bin]]
name = "gate_ernie55_moe"
required-features = ["ernie55"]

# hy4-dsa: Hy4-flash's k-pool selector on the card (the key append, the pool, the forced-tail score
# and top-k) against each kernel's host rule and the exact f64 rule, on synthetic inputs.
[[bin]]
name = "gate_hy4_dsa"
required-features = ["gpu"]

# inkling2-attn: Inkling 2's projection epilogues (the qk/rel L2 clips, the gainless v norm, the
# f16 append) and its rel-bias attention at the group of three (the bias tile, the per-row sink)
# against the host rules and an f64 re-dot, seeded at the Mini's shapes, then the fixture's node
# dumps of prompt a and prompt e's deep occurrences replayed as inputs (refset family
# fx-lcpp-inkling2).
[[bin]]
name = "gate_inkling2_attn"
required-features = ["gpu"]

# inkling2-step: Inkling 2's visit pipeline (the normed attn-res mix, the loop controller, the residual short
# convs), seeded against f64 rules of the PR's graph and the whole forced mix/controller chain against the
# fixture's own node dumps.
[[bin]]
name = "gate_inkling2_step"
required-features = ["gpu"]

# inkling2-moe: Inkling 2's routed block on the card (gate_inkling2_moe's doc): the biased sigmoid
# router at 128 experts and the top 8, the fused w13 split at upload and the NVFP4 and Q8_0 expert
# legs under situ at the file's betas, against the oracle node dumps of whichever tier this run
# holds (the fixture sets fx_ref_inkling2_*, the Mini's ref_inkling2_*).
[[bin]]
name = "gate_inkling2_moe"
required-features = ["gpu"]

# inkling2-pp: Inkling 2's prompt-pass kernels (gate_inkling2_pp's doc): the rel-bias attention over a
# pass's rows at the groups of three and six and the loop controller over a pass's rows, each against
# the step entry on the same inputs, seeded at the Mini's shapes.
[[bin]]
name = "gate_inkling2_pp"
required-features = ["gpu"]

# inkling2-e2e: Inkling 2's whole decode step on one card (gate_inkling2_e2e's doc): the visits of
# the looped trunk, the message bank, the head's mix, against the oracle node dumps of whichever
# tier this run holds; the captured step's node count and the graph against the eager chain.
[[bin]]
name = "gate_inkling2_e2e"
required-features = ["gpu"]

# inkling2-small-host: the Inkling 2 Small's real file on one card with its routed experts on the host
# tier (gate_inkling2_small's doc): the placement, set d's logits row and the teacher-forced argmax
# against the oracle's node dumps. Real tier only.
[[bin]]
name = "gate_inkling2_small"
required-features = ["gpu"]

# inkling2-fold: a UD file as Unsloth ships it (a per-expert scale beside i-quant stacks) against its
# scale-folded copy (gate_inkling2_fold's doc): the same seeded prompt and greedy ids, the same
# prompt logits row. Real tier only.
[[bin]]
name = "gate_inkling2_fold"
required-features = ["gpu"]

# inkling2-mix: Inkling 2 Mini's UD-IQ3_XXS file under a 12 GB card budget, a share of every layer's routed
# experts on the card and the rest on the host (gate_inkling2_mix's doc): the plan's split and the mixed
# load's logits and teacher-forced argmax against the whole-card load of the same file. Real tier only.
[[bin]]
name = "gate_inkling2_mix"
required-features = ["gpu"]

# inkling2-official-card: the official Inkling 2 Mini folder on the card in both dense arms
# (gate_inkling2_official's doc): the arms' dense types and resident bytes apart, each arm's
# teacher-forced argmax over the Mini's greedy tables within the pin. Real tier only.
[[bin]]
name = "gate_inkling2_official"
required-features = ["gpu", "checkpoint"]

# inkling2-draft: Inkling 2's DSpark draft on the card (gate_inkling2_draft's doc): the official
# folder's draft beside the Mini's GGUF in the target's shadow, its acceptance per corpus against the
# reference's. Real tier only.
[[bin]]
name = "gate_inkling2_draft"
required-features = ["gpu", "dspark-hf"]

# inkling2-draft-gguf: the same draft opened from its GGUF beside the Mini's file
# (gate_inkling2_draft_gguf's doc), against the folder's in one target load. Real tier only.
[[bin]]
name = "gate_inkling2_draft_gguf"
required-features = ["gpu", "dspark-hf"]

# ernie55-mla: ERNIE 5.5 Flash Preview's MLA-DSA layer (the latent attention, the lightning indexer's f32 top-k with its
# forced window, the output gate, the k_b/v_b repack) at the released file's shapes, seeded inputs in a synthetic file,
# against an f64 rule of llama.cpp PR #31925; the prompt form is the step form.
[[bin]]
name = "gate_ernie55_mla"
required-features = ["ernie55"]

# ernie55-trunk: ERNIE 5.5 Flash Preview's trunk on the card (the F32 mHC mix with the RMS factor outside the root, the head's four-row mix,
# the post and fold, MultiMax, the dense SiTU block on FP8_B128 and the embedding, the trunk and head components over a synthetic one-layer
# file), seeded inputs, against f64 rules of llama.cpp PR #31925's graph.
[[bin]]
name = "gate_ernie55_trunk"
required-features = ["ernie55"]
