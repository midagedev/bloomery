# kimik3-serve: the Kimi K3 seat of bloomery-serve over the fixture file: the start order, one chat, the finish token, a cut that
# keeps the position or nothing, the tools request refused by name, `--parallel` above one refused.
[[bin]]
name = "gate_kimi_k3_serve"
required-features = ["deepseek41", "kimik3"]

# hy4-serve: the Hy4-flash seat of bloomery-serve over the fixture file: two resident slots planned, one chat with its reasoning split,
# the cut that keeps the position or nothing, each slot's rows kept apart, a tools request answered.
[[bin]]
name = "gate_hy4_serve"
required-features = ["deepseek41", "hy4"]

# ernie55-serve: the ERNIE 5.5 Flash seat of bloomery-serve over the fixture cut (a checkpoint folder): a second slot refused, the load at
# the context asked, one chat turn answered, the cut that keeps the position or nothing.
[[bin]]
name = "gate_ernie55_serve"
required-features = ["deepseek41", "ernie55"]

# inkling2-serve: the Inkling 2 seat of bloomery-serve over the fixture file: the default context planned and named, a second slot refused,
# the load at that context, the oracle prompts tokenized to the references ids, the chat templates render, a forced call parsed into
