[package]
name = "bloomery-gpu-gates"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[lints]
workspace = true

[dependencies]
bloomery-gguf = { path = "../gguf" }
# Host-only edge, live with the `gpu` feature off: the oracle table's `Arch`, and the
# CPU model's deepseek2 names and MLA parameters for the host bins (`exact_ref`, `rawx_floor`).
bloomery-model = { path = "../model" }
# The `.oxart` container's own reader, host-only. `ptx` takes PTX text only as the payloads
# it cuts; `object-read` is the ELF path cuda-core's module loader takes on the same file.
oxide-artifacts = { workspace = true, features = ["object-read"] }
# Optional for the same reason as gpu-spike: with the feature off this package
# has no edge to the device crate, so plain cargo never resolves the
# embedded-bundle anchor symbol.
bloomery-gpu = { path = "../gpu", optional = true }
cuda-core = { workspace = true, optional = true }

[features]
gpu = ["dep:bloomery-gpu", "dep:cuda-core"]
