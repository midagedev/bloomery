[package]
name = "bloomery-gpu-gates"
version = "0.3.11"
edition = "2024"
publish = false
license = "MIT"

[lints]
workspace = true

[dependencies]
# Host only: the engram row hash, which the V4.1 plan gate runs the plan's n-grams through.
bloomery-engram = { path = "../engram" }
bloomery-gguf = { path = "../gguf" }
# Host only: every reference set's reader and the check of which file it was dumped from — the
# node dumps' manifest (re-exported from `lib.rs`), the draft sets, greedy files, KLD bases and
# the vision set.
bloomery-refset = { path = "../refset" }
# Host only, through the `hf` feature: a server's `--hf <repo>[:<quant>]`, the repo's GGUF set or safetensors
# checkpoint fetched into a local cache, and a DSpark draft's configuration. The gates that read no such thing do
# not link it.
bloomery-hf = { path = "../hf", optional = true }
# Host-only checkpoint weights, through `hf` for DSpark and `clef` for the decision head.
bloomery-safetensors = { path = "../safetensors", optional = true }
# Host only, through the `hf` feature: the checkpoint maps, a Qwen3.8 checkpoint folder a server or
# a gate opens (`serve_seats/qwen38_folder.rs`), GLM-5.3-Flash's (`generate_glm5next`'s tensor-parallel read)
# and the architecture of a `--hf` repo's model read before its fetch (a GGUF shard's header by Range, a
# checkpoint's config.json).
bloomery-model-hf = { path = "../model-hf", optional = true }
# Host only: the lever registry, which the binaries parse once at `main`.
bloomery-levers = { path = "../levers" }
# Host only: the one owner of a record line's syntax — the kinds' core, the schema and the reader.
bloomery-record.workspace = true
# Host-only edge, live with the `gpu` feature off: the oracle table's `Arch`, and the
# CPU model's deepseek2 names and MLA parameters for the host bin `exact_ref`.
bloomery-model = { path = "../model" }
# Host only: the CPU tier's ik-verified activation rules (`swiglu_clamp`), which `gate_kquant`
# holds the card's gate·up to.
bloomery-qdot = { path = "../qdot" }
# The `.oxart` container's own reader, host-only. `ptx` takes PTX text only as the payloads
# it cuts; `object-read` is the ELF path cuda-core's module loader takes on the same file.
oxide-artifacts = { workspace = true, features = ["object-read"] }
# The KLD base reader (`kld.rs`) maps ik's base file, a gigabyte at the stock size, instead of
# reading it into memory: the workspace's memmap2, the copy gguf maps the model file with.
memmap2.workspace = true
# Optional on purpose: with the feature off this package has no edge to the
# device crate at all, so plain `cargo build`/`cargo test` never resolve the
# embedded-bundle anchor symbol (which only the cargo-oxide backend defines).
bloomery-gpu = { path = "../gpu", optional = true }
# The host rules the LFM3 kernel gate holds a kernel to (`chain::shortconv`, `chain::out_gate`), through the `gpu`
# feature.
bloomery-chain = { workspace = true, optional = true }
# The device contract, through the `gpu` feature: `gate_gpu_device` runs its clauses on the card.
bloomery-device = { path = "../device", optional = true }
# The V4.1 device crate, reached only through the `deepseek41` feature (the V4.1 op gates): a
# compiler failure in V4.1 device code then breaks those gates' builds and no other.
bloomery-gpu-deepseek41 = { path = "../gpu-deepseek41", optional = true }
# The GLM-5.3-Flash program, reached only through the `glm5next` feature (its generator and its
# end-to-end gate).
bloomery-gpu-glm5next = { path = "../gpu-glm5next", optional = true }
# The MiMo-V2.6-Flash program, reached only through the `mimo2` feature (its end-to-end gate).
bloomery-gpu-mimo2 = { path = "../gpu-mimo2", optional = true }
# The Solar-Open2 program, reached only through the `solar2` feature (its end-to-end and prefill gates and the
# `bloomery-serve` seat).
bloomery-gpu-solar2 = { path = "../gpu-solar2", optional = true }
# The MiniMax-M3 program, reached only through the `minimaxm3` feature (its sparse-attention gate).
bloomery-gpu-minimaxm3 = { path = "../gpu-minimaxm3", optional = true }
bloomery-gpu-flint = { path = "../gpu-flint", optional = true }
# The EmbeddingGemma 2 encoder, reached only through the `gemma-embedding2` feature (its end-to-end
# gate).
bloomery-gpu-gemma-embedding2 = { path = "../gpu-gemma-embedding2", optional = true }
bloomery-gpu-gemma4a = { path = "../gpu-gemma4a", optional = true }
cuda-core = { workspace = true, optional = true }
# A gate binary's own `#[cuda_module]` (`gate_kquant`: entries no engine binary links) needs the
# device and host halves of cuda-oxide as direct dependencies: the macros emit `::cuda_host` and
# `::cuda_device` paths.
cuda-device = { workspace = true, optional = true }
cuda-host = { workspace = true, optional = true }
# The V4.1 decode CLI (`generate_ds41`) owns its main thread: it pins it to the dispatcher's cpu
# slot as bloomery-decode does, and reads its own fault counts (`getrusage`) under
# `BLOOMERY_STEP_STATS`. Reached only through the `deepseek41` feature.
bloomery-threads = { path = "../threads", optional = true }
libc = { workspace = true, optional = true }
# `link_probe`'s endpoint record: the RDMA end's queue pair, GID, address and key (`gpu` feature).
bloomery-verbs = { path = "../verbs", optional = true }
# Text in and out through the file's own vocabulary: `bloomery-chat` (the `deepseek41`
# feature) and `generate_qwen3moe --prompt` (the `gpu` feature). Host only.
bloomery-tokenizer = { path = "../tokenizer", optional = true }
bloomery-sampler = { path = "../sampler", optional = true }
# `bloomery-serve-ds41`: the HTTP server's `Engine` over the V4.1 generator (`bind`), and its gate
# `gate_ds41_serve`, which reads the server's JSON. Reached only through the `deepseek41` feature.
bloomery-serve = { path = "../serve", optional = true }
# `bloomery-serve`'s decide seat: Clef's request encoder and joint schema head, and lev's label readout,
# on the host, served by the decision server of `bloomery-serve`; and the request reader and answer formulas
# of `/v1/systemone` on a generative seat, which the serve gates post to. Reached through the `clef` feature
# (which also turns on the crate's `safetensors` reader, for Clef's head file) and the `deepseek41` one (which
# links `bloomery-serve`, and reads no head file).
bloomery-decision = { path = "../decision", optional = true }
serde_json = { version = "=1.0.151", optional = true }
# `generate_ds41` drives the V4.1 session (`bloomery-app`, its `deepseek41` feature) through the
# generation loop and the drafts of `bloomery-runtime`; `generate_qwen3moe` runs its arms through
# the session (the `gpu` feature, no model crate of the session's); the library's `vision_seat`
# names it for an image seat's prompt call (`Encoded::prompt`). The session crate names the V4.1
# device crate under `deepseek41`.
bloomery-app = { path = "../app", optional = true }
bloomery-runtime = { path = "../runtime", optional = true }
# The V4.1 image encoder on the card and its host crate: the device encoder is reached
# only through the `vision` feature (`gate_vision_encoder`), so a compiler failure in its
# device code breaks that gate's build and no other; the host crate `deepseek41` reaches
# too (the feature's own comment below).
bloomery-gpu-vision = { path = "../gpu-vision", optional = true }
bloomery-vision = { path = "../vision", optional = true }

[features]
# DSpark draft configuration and mapped weights, without the model-file fetch and header readers.
dspark-hf = ["dep:bloomery-hf", "dep:bloomery-safetensors"]
# The hub: `--hf` fetches and reads the repo's model header before the download.
hf = ["dspark-hf", "dep:bloomery-model-hf"]
# A safetensors checkpoint folder read as stored: a server's or a gate's `-m <folder>`, and the folder a
# `--hf` repo that holds a checkpoint resolves to.
checkpoint = ["hf"]
# GLM-5.3-Flash read from its Hugging Face checkpoint folder: `generate_glm5next --place tp`.
glm5next-hf = ["glm5next", "checkpoint"]
gpu = [
    "dep:bloomery-gpu",
    "dep:bloomery-chain",
    "dep:bloomery-device",
    "dep:bloomery-verbs",
    "dep:bloomery-threads",
    "dep:libc",
    "dep:cuda-core",
    "dep:cuda-device",
    "dep:cuda-host",
    "dep:bloomery-tokenizer",
    "dep:bloomery-app",
    "bloomery-app/dspark",
    "dep:bloomery-runtime",
]
deepseek41 = [
    "gpu",
    "dep:bloomery-gpu-deepseek41",
    "dep:bloomery-threads",
    "dep:libc",
    "dep:bloomery-tokenizer",
    "dep:bloomery-sampler",
    "dep:bloomery-serve",
    "dep:bloomery-decision",
    "dep:serde_json",
    "dep:bloomery-app",
    "bloomery-app/deepseek41",
    "dep:bloomery-runtime",
    # The V4.1 image input's host half (the span assembly `ds41_media` and the
    # encoder file's hyperparameters), pure: the device encoder stays behind
    # `vision`, so a compiler failure in its device code still breaks that
    # gate's build and no other.
    "dep:bloomery-vision",
]
vision = ["gpu", "dep:bloomery-gpu-vision", "dep:bloomery-vision"]
clef = ["gpu", "dep:bloomery-decision", "bloomery-decision/safetensors", "dep:bloomery-safetensors", "dep:bloomery-serve", "dep:serde_json"]
glm5next = ["deepseek41", "dep:bloomery-gpu-glm5next", "bloomery-app/glm5next"]
mimo2 = ["gpu", "dep:bloomery-gpu-mimo2", "bloomery-app/mimo2"]
solar2 = ["gpu", "dep:bloomery-gpu-solar2", "bloomery-app/solar2"]
minimaxm3 = ["gpu", "dep:bloomery-gpu-minimaxm3", "bloomery-app/minimaxm3"]
flint = ["gpu", "dep:bloomery-gpu-flint", "bloomery-app/flint"]
gemma-embedding2 = ["gpu", "gemma4a", "dep:bloomery-gpu-vision", "dep:bloomery-gpu-gemma-embedding2", "dep:bloomery-serve"]
gemma4a = ["gpu", "dep:bloomery-gpu-gemma4a", "dep:bloomery-vision"]

[[bin]]
name = "gate_gemma4a"
path = "src/bin/gate_gemma4a.rs"
required-features = ["gemma4a"]

# A bin whose `main` sits behind a feature requires that feature: cargo refuses to build it without the
# feature before it links anything, instead of linking the feature-off stub `main` over the working
# target/release/<bin>. The bins not named here are found in src/bin/ and need no feature.
[[bin]]
name = "bloomery-chat"
path = "src/bin/bloomery_chat.rs"
required-features = ["deepseek41"]

[[bin]]
