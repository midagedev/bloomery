[package]
name = "bloomery-serve"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "llama-server-compatible HTTP API (OpenAI /v1 plus llama.cpp /completion) over an Engine trait"

[lib]
name = "serve"

[[bin]]
name = "bloomery-serve"
path = "src/bin/bloomery-serve.rs"

[lints]
workspace = true

[dependencies]
# The HTTP layer is std::net on purpose: one slot, one engine mutex, and SSE needs a flush per
# event. JSON is the only third-party need.
bloomery-gguf = { path = "../gguf" }
serde_json = "=1.0.151"
thiserror.workspace = true
