[package]
name = "bloomery-serve"
version = "0.3.11"
edition = "2024"
publish = false
license = "MIT"
description = "llama-server-compatible HTTP API (OpenAI /v1 plus llama.cpp /completion) over an Engine trait"

[lib]
name = "serve"

[[bin]]
name = "bloomery-serve"
path = "src/bin/bloomery-serve.rs"

[lints]
workspace = true

[dependencies]
# The decision models' request reader and answer formulas, which a generative seat's `/v1/systemone`
# shares with the decide seat. Host code only: its closure holds no device crate.
bloomery-decision = { path = "../decision" }
bloomery-embed = { path = "../embed" }
# The HTTP layer is std::net on purpose: one slot, one engine mutex, and SSE needs a flush per
# event. JSON is its only third-party need.
bloomery-gguf = { path = "../gguf" }
# The chat-template engine: `ChatTemplate` and `TemplateError` are the jinja crate's, re-exported here.
bloomery-jinja = { path = "../jinja" }
# The tool-call markup of a format is its description's (`models::function_xml`): the scanner reads a reply by
# the strings the template table names a file's format by.
bloomery-models = { path = "../models" }
# The file's vocabulary as the server's `Tokenizer` (`vocab::Vocab`), and the sampler crate's chain as
# the server's sampler factory (`sampling::sampler_factory`): every seat's, the CUDA seats' and Metal's.
bloomery-tokenizer = { path = "../tokenizer" }
bloomery-sampler = { path = "../sampler" }
bloomery-threads = { path = "../threads" }
# The media part: the image decoders and a model's MediaModel (data plus one prepare) are the vision
# crate's; an image's cache key is the sha256 of its file bytes.
bloomery-vision = { path = "../vision" }
sha2.workspace = true
# `preserve_order`: an object keeps the key order it was parsed or built in, as a Python dict
# does, so a chat template's `tojson` and `.items()` see a request's objects as jinja2 does.
# `arbitrary_precision`: tool arguments keep JSON numbers outside the f64 range.
serde_json = { version = "=1.0.151", features = ["preserve_order", "arbitrary_precision"] }
# A `logit_bias` key named twice, which `serde_json`'s map keeps only the last of.
serde = "=1.0.229"
thiserror.workspace = true
# The orderly stop's signal handlers: `sigaction`, a `write` a handler makes,
# a `read` the reader thread blocks on. The workspace's pinned version.
libc.workspace = true
