[package]
name = "bloomery-serve"
version = "0.2.0"
edition = "2024"
publish = false
license = "MIT"
description = "llama-server-compatible HTTP API (OpenAI /v1 plus llama.cpp /completion) over an Engine trait"

[lib]
name = "serve"

[[bin]]
name = "bloomery-serve"
path = "src/bin/bloomery-serve.rs"

[lints]
workspace = true

[dependencies]
# The HTTP layer is std::net on purpose: one slot, one engine mutex, and SSE needs a flush per
# event. JSON is the only third-party need.
bloomery-gguf = { path = "../gguf" }
# `preserve_order`: an object keeps the key order it was parsed or built in, as a Python dict
# does, so a chat template's `tojson` and `.items()` see a request's objects as jinja2 does.
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
thiserror.workspace = true
