[package]
name = "bloomery-gpu-deepseek41"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[lints]
workspace = true

[dependencies]
cuda-device.workspace = true
cuda-host.workspace = true
cuda-core.workspace = true
# Shared device bodies (`bloomery_gpu::cores`) and the runtime types the launchers take.
bloomery-gpu = { path = "../gpu" }
# Host only: the body sizes its buffers from the file's hyperparameters and the placement plan,
# and its step image copies the host step plan.
bloomery-gguf = { path = "../gguf" }
bloomery-model = { path = "../model" }
# Host only: the glue's host half reads each token's engram rows through the engram tables.
bloomery-engram = { path = "../engram" }
