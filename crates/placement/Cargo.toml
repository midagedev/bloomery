[package]
name = "bloomery-placement"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

# The lib name is the full `bloomery_placement`: a short `placement` would
# collide with `bloomery-model`'s own `placement` module in every `use` path
# there (this crate is its dependency).
[lib]
name = "bloomery_placement"

[lints]
workspace = true

[dependencies]
bloomery-gguf = { path = "../gguf" }
bloomery-levers = { path = "../levers" }
bloomery-models = { path = "../models" }
# The residency profile ranks a layer's experts by the one rank the residency
# rules share (`runtime::xsplit::rank_key`); the runtime depends on the model
# description alone, so the edge makes no cycle.
bloomery-runtime = { path = "../runtime" }
thiserror = { workspace = true }
