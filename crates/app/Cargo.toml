[package]
name = "bloomery-app"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

# The GPU side of a generation: `Session<B>`, one model on its card behind the runtime's traits
# (`bloomery-runtime`), and the drafts that run on a card. No device code of its own; the models'
# device crates come in by feature, so a binary links only the model it opens.
[lib]
name = "app"

[lints]
workspace = true

[dependencies]
bloomery-gpu = { path = "../gpu" }
bloomery-gguf = { path = "../gguf" }
bloomery-model = { path = "../model" }
bloomery-runtime = { path = "../runtime" }
# The V4.1 session and its DSpark draft on the other card (`arch::deepseek41`).
bloomery-gpu-deepseek41 = { path = "../gpu-deepseek41", optional = true }
# The GLM-5.3-Flash session (`arch::glm5next`).
bloomery-gpu-glm5next = { path = "../gpu-glm5next", optional = true }
# The MiMo-V2.6-Flash session (`arch::mimo2`).
bloomery-gpu-mimo2 = { path = "../gpu-mimo2", optional = true }
# The MiniMax-M3 session (`arch::minimaxm3`).
bloomery-gpu-minimaxm3 = { path = "../gpu-minimaxm3", optional = true }
# The Solar-Open2 session (`arch::solar2`).
bloomery-gpu-solar2 = { path = "../gpu-solar2", optional = true }
# The levers the sessions' own configurations carry (the plan's card budget, the host set's load
# settings). The crate has no dependency of its own, so every session reads it.
bloomery-levers = { path = "../levers" }
cuda-core = { workspace = true, optional = true }

[features]
dspark = ["dep:cuda-core"]
deepseek41 = ["dep:bloomery-gpu-deepseek41", "dspark"]
glm5next = ["dep:bloomery-gpu-glm5next"]
mimo2 = ["dep:bloomery-gpu-mimo2"]
minimaxm3 = ["dep:bloomery-gpu-minimaxm3"]
solar2 = ["dep:bloomery-gpu-solar2"]
