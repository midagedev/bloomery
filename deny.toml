# cargo deny — 의존성 감사. `just deny`.
# 이 레포에서 제일 중요한 항목은 [sources]다. cuda-oxide가 git 의존이고,
# rev 없이 떠 있으면 어제 잰 수치와 오늘 잰 수치가 다른 컴파일러에서 나온다.

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "Unicode-3.0", "ISC"]


[bans]
multiple-versions = "warn"
wildcards = "deny"
# 워크스페이스 멤버끼리는 버전 없는 path 의존으로 묶이고, 멤버는 전부 publish = false다. 이 설정이
# 풀어 주는 것은 정확히 그 경우뿐이다 — crates.io·git 의존의 와일드카드는 여전히 막힌다.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/NVlabs/cuda-oxide.git"]
# git 의존은 rev로만 받는다. branch나 tag로 떠 있으면 rc가 0이 아니다(git-source-underspecified).
required-git-spec = "rev"
