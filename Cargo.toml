[workspace]
resolver = "3"
members = ["crates/qdot", "crates/gguf", "crates/models", "crates/model", "crates/model-hf", "crates/placement", "crates/threads", "crates/levers", "crates/verbs", "crates/gpu", "crates/gpu-deepseek41", "crates/gpu-mistrallarge4", "crates/gpu-glm5next", "crates/gpu-mimo2", "crates/gpu-solar2", "crates/gpu-minimaxm3", "crates/gpu-flint", "crates/gpu-gemma-embedding2", "crates/gpu-gates", "crates/engram", "crates/engram-lab", "crates/sampler", "crates/tokenizer", "crates/serve", "crates/jinja", "crates/vision", "crates/gpu-vision", "crates/gpu-gemma4a", "crates/refset", "crates/runtime", "crates/app", "crates/decision", "crates/embed", "crates/hf", "crates/safetensors", "crates/os", "crates/device", "crates/metal", "crates/record", "crates/chain"]
# 의도적으로 컴파일되지 않는 재현기다(MUL-7). 워크스페이스에 넣으면 --workspace가 영구히 빨갛다.
exclude = ["crates/oxide-ice-unroll", "crates/oxide-ice-unroll/variants/unroll_smoke", "fuzz", "labs/hip-native"]

[workspace.dependencies]
# cuda-oxide is NVIDIA/cuda-rust (cuda-oxide lives under cuda-oxide/ there, cuda-core at the root), taken straight from
# that repository by rev. A floating rev puts yesterday's numbers and today's on different compilers. A rev move here
# needs the box's backend and cargo-oxide for that rev (tools/box.sh, docs/BUILD.md) and rust-toolchain.toml on the
# channel of that rev's cuda-oxide/rust-toolchain.toml.
cuda-device = { version = "0.2.1", git = "https://github.com/NVIDIA/cuda-rust.git", rev = "9df9e7cef561e03a066230b3bb433b3d8285da81" }
cuda-host = { version = "0.2.1", git = "https://github.com/NVIDIA/cuda-rust.git", rev = "9df9e7cef561e03a066230b3bb433b3d8285da81" }
# cuda-host takes cuda-core by path inside the same repository, so cuda-core comes from that repository and rev too: a
# crates.io copy would be a second crate whose types are not cuda-host's.
cuda-core = { version = "0.5.0", git = "https://github.com/NVIDIA/cuda-rust.git", rev = "9df9e7cef561e03a066230b3bb433b3d8285da81" }
# The .oxart container parser is the copy cuda-core's module loader links: cuda-core and cuda-host both take
# oxide-artifacts from crates.io (the repository's own copy is its publish source, not a dependency). Requirements on
# one semver line unify into one version, so the gates cut the text handed to the driver with the loader's own code.
oxide-artifacts = "0.2.1"
libc = "0.2"
# The one owner of the operating-system calls the host chain makes: the crate
# that holds what Linux and macOS do differently.
bloomery-os = { path = "crates/os" }
# The one owner of a record line's syntax: the kinds' core, the schema and the
# reader every line's own crate goes through.
bloomery-record = { path = "crates/record" }
# The chain plans the device backends share: host data, no device code.
bloomery-chain = { path = "crates/chain" }
# The decision head's host sgemm (crates/decision); its own threading stays off.
matrixmultiply = { version = "0.3.10", default-features = false, features = ["std"] }
memmap2 = "0.9"
sha2 = "0.10"
thiserror = "2"

# The Metal backend's Objective-C bindings, pinned by version: a bound that
# floats changes the generated code under the same version number. The
# features are the ones the backend uses; the rest of the framework stays
# out.
objc2 = { version = "=0.6.4", default-features = false, features = ["std"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSObject", "NSString", "NSError", "NSArray", "NSProcessInfo"] }
objc2-metal = { version = "=0.3.2", default-features = false, features = ["std", "MTLTypes", "MTLDevice", "MTLResource", "MTLAllocation", "MTLBuffer", "MTLLibrary", "MTLComputePipeline", "MTLCommandQueue", "MTLCommandBuffer", "MTLCommandEncoder", "MTLComputeCommandEncoder", "MTLEvent", "dispatch2"] }
# The dispatch data a metallib is loaded from.
dispatch2 = { version = "=0.3.0", default-features = false, features = ["alloc", "block2"] }

# 값은 2026-09-19에 박스에서 실측한 적중 수를 근거로 정했다. 0건인 것만 deny로 올린다.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"     # 적중 0

[profile.test.package.bloomery-placement]
opt-level = 1

[workspace.lints.clippy]
missing_safety_doc = "deny"         # 적중 0
undocumented_unsafe_blocks = "deny" # 적중 0 (del2 뒤; 54였다) — 새 unsafe 블록은 SAFETY 주석 없이는 컴파일되지 않는다
borrowed_box = "deny"               # 적중 0
clone_on_copy = "deny"              # 적중 0
cloned_instead_of_copied = "deny"   # 적중 0
default_trait_access = "deny"       # 적중 0
derivable_impls = "deny"            # 적중 0
double_must_use = "deny"            # 적중 0
fn_params_excessive_bools = "deny"  # 적중 0
get_unwrap = "deny"                 # 적중 0
implicit_clone = "deny"             # 적중 0
iter_overeager_cloned = "deny"      # 적중 0
len_without_is_empty = "deny"       # 적중 0
manual_let_else = "deny"            # 적중 0
match_wildcard_for_single_variants = "deny" # 적중 0
needless_for_each = "deny"          # 적중 0
new_ret_no_self = "deny"            # 적중 0
new_without_default = "deny"        # 적중 0
ptr_arg = "deny"                    # 적중 0
rc_buffer = "deny"                  # 적중 0
redundant_clone = "deny"            # 적중 0
return_self_not_must_use = "deny"   # 적중 0
should_implement_trait = "deny"     # 적중 0
string_add = "deny"                 # 적중 0
string_add_assign = "deny"          # 적중 0
unnecessary_unwrap = "deny"         # 적중 0
wrong_self_convention = "deny"      # 적중 0
