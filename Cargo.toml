[workspace]
resolver = "3"
members = ["crates/qdot", "crates/gguf", "crates/models", "crates/model", "crates/placement", "crates/threads", "crates/levers", "crates/gpu", "crates/gpu-deepseek41", "crates/gpu-glm5next", "crates/gpu-mimo2", "crates/gpu-gates", "crates/engram", "crates/engram-lab", "crates/sampler", "crates/tokenizer", "crates/serve", "crates/jinja", "crates/vision", "crates/gpu-vision", "crates/refset", "crates/runtime", "crates/app", "crates/decision", "crates/hf"]
# 의도적으로 컴파일되지 않는 재현기다(MUL-7). 워크스페이스에 넣으면 --workspace가 영구히 빨갛다.
exclude = ["crates/oxide-ice-unroll", "crates/oxide-ice-unroll/variants/unroll_smoke"]

[workspace.dependencies]
# cuda-oxide는 rev로 고정한다. 떠 있으면 어제의 수치와 오늘의 수치가 다른 컴파일러에서 나온다.
cuda-device = { version = "0.2.1", git = "https://github.com/NVIDIA/cuda-rust.git", rev = "1691162ab9204ef21b0329c2e8059815420dfd5a" }
cuda-host = { version = "0.2.1", git = "https://github.com/NVIDIA/cuda-rust.git", rev = "1691162ab9204ef21b0329c2e8059815420dfd5a" }
# cuda-host takes cuda-core by path inside the same repository, so cuda-core comes from that repository and rev
# too (and through the same [patch] below): a crates.io copy would be a second crate whose types are not cuda-host's.
cuda-core = { version = "0.4.0", git = "https://github.com/NVIDIA/cuda-rust.git", rev = "1691162ab9204ef21b0329c2e8059815420dfd5a" }
# The .oxart container parser is the copy cuda-core's module loader links: cuda-core and cuda-host both take
# oxide-artifacts from crates.io (the repository's own copy is its publish source, not a dependency). Requirements on
# one semver line unify into one version, so the gates cut the text handed to the driver with the loader's own code.
oxide-artifacts = "0.2.1"
libc = "0.2"
# The decision head's host sgemm (crates/decision); its own threading stays off.
matrixmultiply = { version = "0.3.10", default-features = false, features = ["std"] }
memmap2 = "0.9"
sha2 = "0.10"
thiserror = "2"

# The declarations above name the NVIDIA/cuda-rust rev (cuda-oxide lives under cuda-oxide/ there, cuda-core at the
# root); the source comes from our fork (midagedev/cuda-oxide), branch `bloomery` = that rev + the patches meant for
# upstream (listed in THIRD_PARTY_NOTICES.md). With no patch left this section goes. A rev move here needs the box's
# backend rebuilt for that rev (tools/box.sh, CUDA_OXIDE_BACKEND).
[patch."https://github.com/NVIDIA/cuda-rust.git"]
cuda-device = { git = "https://github.com/midagedev/cuda-oxide.git", rev = "4da6c138448538ca12218cb80924c070417ab419" }
cuda-host = { git = "https://github.com/midagedev/cuda-oxide.git", rev = "4da6c138448538ca12218cb80924c070417ab419" }
cuda-core = { git = "https://github.com/midagedev/cuda-oxide.git", rev = "4da6c138448538ca12218cb80924c070417ab419" }

# 값은 2026-09-19에 박스에서 실측한 적중 수를 근거로 정했다. 0건인 것만 deny로 올린다.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"     # 적중 0

[workspace.lints.clippy]
missing_safety_doc = "deny"         # 적중 0
undocumented_unsafe_blocks = "deny" # 적중 0 (del2 뒤; 54였다) — 새 unsafe 블록은 SAFETY 주석 없이는 컴파일되지 않는다
